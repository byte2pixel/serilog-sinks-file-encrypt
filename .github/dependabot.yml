version: 2

updates:
  # NuGet dependencies for all three package trees (src, tests, examples).
  # Deliberately a single entry: Dependabot's NuGet discovery walks up from each
  # directory to the repo root and picks up .config/dotnet-tools.json, so separate
  # entries per tree each open their own PR for the same tool update (see #132/#133).
  - package-ecosystem: "nuget"
    directories:
      - "/src"
      - "/tests"
      - "/examples"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "byte2pixel"
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    reviewers:
      - "byte2pixel"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
